[plugin_settings."noctalia/mpvpaper"]
video_directory = "/nix/store/9b893sy0sl86gl6lh883kq6zhfgj0cvy-source/assets/backgrounds/animated"

[plugins]
enabled = [ "noctalia/translator", "noctalia/mpvpaper" ]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

    [[plugins.source]]
    enabled = false
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins/tree/main/mpvpaper"
    name = "liveWallpaper"

[theme]
builtin = "Eldritch"
community_palette = "Monochrome"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "hyprland", "kitty", "qt", "starship" ]
    community_ids = [ "obsidian", "vscode", "rofi", "discord", "steam", "hyprtoolkit" ]
    enable_builtin_templates = true
    enable_community_templates = true

[wallpaper]
directory = "@FLAKE@/assets/backgrounds/berserk"
transition_on_startup = true

    [wallpaper.automation]
    enabled = true

    [wallpaper.default]
    path = "@FLAKE@/assets/backgrounds/berserk/Armor.jpg"

    [wallpaper.last]
    path = "@FLAKE@/assets/backgrounds/berserk/Armor.jpg"

    [wallpaper.monitors.DP-1]
    path = "/nix/store/ila3vrzilhganjnwk7xp4f4jfilkc3wp-source/assets/backgrounds/berserk/trees.jpg"

    [wallpaper.monitors.DP-3]
    path = "/nix/store/ila3vrzilhganjnwk7xp4f4jfilkc3wp-source/assets/backgrounds/berserk/trees.jpg"

    [wallpaper.monitors.DP-4]
    path = "@FLAKE@/assets/backgrounds/berserk/trees.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "@FLAKE@/assets/backgrounds/berserk/Armor.jpg"

    [wallpaper.monitors.HDMI-A-2]
    path = "@FLAKE@/assets/backgrounds/berserk/trees.jpg"

    [wallpaper.monitors.eDP-1]
    path = "@FLAKE@/assets/backgrounds/berserk/trees.jpg"

[widget.battery]
display_mode = "graphic"

[widget.media]
capsule = true
hide_when_no_media = true
title_scroll = "on_hover"

[widget.mpvpaper]
type = "noctalia/mpvpaper:mpvpaper"

[widget.workspaces]
capsule = true
hide_when_empty = true