[bar]
order = [ "Chrisser" ]

    [bar.Chrisser]
    center = [ "workspaces" ]
    end = [ "group:g4", "group:g1", "group:g2" ]
    font_family = "CaskaydiaCove Nerd Font Mono"
    font_weight = 400
    margin_edge = 0
    margin_ends = 0
    radius = 0
    start = [ "group:g3", "media", "audio_visualizer" ]
    widget_spacing = 10

        [[bar.Chrisser.capsule_group]]
        border = "primary"
        fill = "surface_variant"
        foreground = "primary"
        id = "g1"
        members = [ "volume", "battery", "bluetooth" ]
        opacity = 1.0
        padding = 6.0

        [[bar.Chrisser.capsule_group]]
        border = "primary"
        fill = "surface_variant"
        foreground = "tertiary"
        id = "g2"
        members = [ "control-center", "date", "clock", "session" ]
        opacity = 1.0
        padding = 6.0

        [[bar.Chrisser.capsule_group]]
        border = "primary"
        fill = "surface_variant"
        foreground = "secondary"
        id = "g3"
        members = [ "network", "cpu", "ram" ]
        opacity = 1.0
        padding = 10.0

        [[bar.Chrisser.capsule_group]]
        border = "primary"
        fill = "surface_variant"
        foreground = "secondary"
        id = "g4"
        members = [ "notifications", "wallpaper", "mpvpaper", "clipboard" ]
        opacity = 1.0
        padding = 6.0

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
auto_hide = true

[location]
auto_locate = true

[lockscreen_widgets]
